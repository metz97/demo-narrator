<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Shared demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    /* The public page is deliberately not the app: no nav, no project chrome. */
    body { background: #f4f2ef; }
    .sharebar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 15px 30px; border-bottom: 1px solid var(--line-soft);
    }
    .sharebar .who { display: flex; align-items: center; gap: 8px; font: 700 12.5px var(--sans); color: var(--muted); }
    .sharewrap { padding: 34px 30px 40px; max-width: 940px; margin: 0 auto; }
    .kicker {
      font: 700 10.5px var(--sans); letter-spacing: .18em; color: var(--muted-2);
      text-transform: uppercase; margin-bottom: 9px;
    }
    .sharewrap h1 { font: 800 28px/1.15 var(--sans); letter-spacing: -.02em; margin-bottom: 6px; }
    .lede { font: 400 13px var(--sans); color: var(--muted); margin-bottom: 20px; }
    .player { border-radius: 14px; overflow: hidden; background: #0f0b1d; box-shadow: var(--shadow-pop); }
    .player video { border-radius: 0; }
    .below { display: grid; grid-template-columns: 1fr 300px; gap: 20px; margin-top: 20px; align-items: start; }
    @media (max-width: 860px) { .below { grid-template-columns: 1fr; } }
    .dl { display: grid; gap: 7px; }
    .dl a {
      font: 600 11.5px var(--sans); padding: 9px 11px;
      border: 1px solid rgba(22, 21, 26, .13); border-radius: var(--r-field);
      display: flex; justify-content: space-between; color: var(--ink); text-decoration: none;
    }
    .dl a:hover { background: var(--canvas); }
    .dl a .meta { color: var(--muted-2); font-weight: 400; }
    .chapters { display: grid; gap: 11px; }
    .chapter {
      display: flex; gap: 12px; align-items: flex-start;
      background: none; border: none; padding: 0; text-align: left;
      font: inherit; color: inherit; cursor: pointer; width: 100%;
    }
    .chapter:hover { background: none; }
    .chapter:hover .ct { text-decoration: underline; }
    .chapter .at {
      font: 500 11px var(--mono); color: var(--accent);
      flex: none; width: 34px; padding-top: 2px;
    }
    .chapter .ct { display: block; font: 600 12.5px var(--sans); margin-bottom: 2px; }
    .chapter .cs { display: block; font: 400 11.5px/1.55 var(--sans); color: var(--muted-2); }
    .chapter.on .ct { color: var(--accent-strong); }
    .madeby {
      margin-top: 15px; padding-top: 14px; border-top: 1px solid var(--line-soft);
      font: 400 11.5px/1.6 var(--sans); color: var(--muted-2);
    }
    .gate { max-width: 380px; margin: 80px auto; text-align: center; }
    .gate .card { text-align: left; }
    .foot { margin-top: 26px; text-align: center; font: 400 11.5px var(--sans); color: var(--muted-2); }
    .dead { max-width: 460px; margin: 90px auto; text-align: center; }
  </style>
</head>
<body>
  <div id="page"><div class="sharewrap"><p class="muted">Loading…</p></div></div>

<script>
const token = decodeURIComponent(location.pathname.replace(/^\/s\//, "").replace(/\/$/, ""));
const page = document.getElementById("page");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clock = (sec) => {
  if (sec == null) return "";
  const s = Math.round(sec);
  return `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, "0")}s`;
};
const mark = (sec) => {
  const s = Math.floor(sec || 0);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
};
const dateLabel = (iso) => {
  if (!iso) return null;
  const d = new Date(iso.endsWith("Z") || iso.includes("+") ? iso : iso + "Z");
  return d.toLocaleDateString([], { day: "numeric", month: "short", year: "numeric" });
};

async function load() {
  let meta;
  try {
    const res = await fetch(`/s/${encodeURIComponent(token)}/meta`);
    if (res.status === 410 || res.status === 404) return dead(await res.text(), res.status);
    if (!res.ok) throw new Error(await res.text());
    meta = await res.json();
  } catch (e) {
    return dead("This link could not be opened.", 0);
  }
  if (meta.needs_password && !meta.unlocked) return gate(meta);
  show(meta);
}

function dead(detail, status) {
  let msg = "This link is no longer available.";
  try { msg = JSON.parse(detail).detail || msg; } catch { /* plain text is fine */ }
  page.innerHTML = `
    <div class="dead">
      <div style="font-size:30px;margin-bottom:12px">🔗</div>
      <h1 style="font:800 22px var(--sans);margin-bottom:8px">${status === 404 ? "Link not found" : "Link no longer works"}</h1>
      <p class="muted">${esc(msg)}</p>
      <p class="muted" style="margin-top:14px">Ask whoever sent it to issue a new one.</p>
    </div>`;
}

function gate(meta) {
  page.innerHTML = `
    <div class="gate">
      <div style="font-size:26px;margin-bottom:10px">🔒</div>
      <h1 style="font:800 20px var(--sans);margin-bottom:6px">This demo is password protected</h1>
      <p class="muted" style="margin-bottom:18px">Enter the password you were given.</p>
      <div class="card">
        <label class="field"><span>Password</span>
          <input type="password" id="pw" style="width:100%" autofocus></label>
        <div class="errbox" id="pwErr" style="display:none;margin-top:10px"></div>
        <button class="primary" id="unlock" style="width:100%;justify-content:center;margin-top:12px">Unlock</button>
      </div>
    </div>`;
  const go = async () => {
    const btn = document.getElementById("unlock");
    const err = document.getElementById("pwErr");
    btn.disabled = true; btn.textContent = "Checking…";
    try {
      const res = await fetch(`/s/${encodeURIComponent(token)}/unlock`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: document.getElementById("pw").value }),
      });
      if (!res.ok) throw new Error("That password did not work.");
      load();
    } catch (e) {
      err.textContent = e.message;
      err.style.display = "";
      btn.disabled = false; btn.textContent = "Unlock";
    }
  };
  document.getElementById("unlock").onclick = go;
  document.getElementById("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
}

function show(meta) {
  const expiry = dateLabel(meta.expires_at);
  page.innerHTML = `
    <div class="sharebar">
      <div class="who"><span style="font-size:14px">🎬</span>
        <span>Shared with you${meta.project ? ` from ${esc(meta.project)}` : ""}</span></div>
      <span class="muted2">${expiry ? `Link expires ${esc(expiry)}` : "Link does not expire"}</span>
    </div>
    <div class="sharewrap">
      <div class="kicker">Product demo</div>
      <h1>${esc(meta.title || "Demo")}</h1>
      <p class="lede">${clock(meta.duration_sec)}${meta.has_srt ? " · captions available" : ""}</p>
      <div class="player">
        <video id="vid" controls playsinline preload="metadata" src="/s/${encodeURIComponent(token)}/video">
          ${meta.has_srt ? `<track kind="captions" label="English" src="/s/${encodeURIComponent(token)}/srt" default>` : ""}
        </video>
      </div>
      <div class="below">
        <div class="card">
          <div style="font:700 13px var(--sans);margin-bottom:12px">${
            (meta.chapters || []).length ? "In this demo" : "About this demo"}</div>
          ${(meta.chapters || []).length ? `
            <div class="chapters">
              ${meta.chapters.map((c) => `
                <button class="chapter" data-seek="${c.start_sec}">
                  <span class="at">${mark(c.start_sec)}</span>
                  <span>
                    <span class="ct">${esc(c.title)}</span>
                    ${c.summary ? `<span class="cs">${esc(c.summary)}</span>` : ""}
                  </span>
                </button>`).join("")}
            </div>
            <div class="madeby">Recorded automatically from the running application —
              no slides, no editing.</div>`
          : `<p class="muted" style="line-height:1.65">Recorded automatically from the running
              application — no slides, no editing. The narration is generated from the work
              items that shipped.</p>`}
        </div>
        <div style="display:grid;gap:11px">
          ${meta.allow_download ? `
            <div class="card" style="padding:16px">
              <div style="font:700 12.5px var(--sans);margin-bottom:10px">Download</div>
              <div class="dl">
                <a href="/s/${encodeURIComponent(token)}/download"><span>Video</span><span class="meta">mp4</span></a>
                ${meta.has_srt ? `<a href="/s/${encodeURIComponent(token)}/srt" download><span>Captions</span><span class="meta">srt</span></a>` : ""}
              </div>
            </div>` : `
            <div class="card" style="padding:16px">
              <div class="muted">Downloads are disabled for this link.</div>
            </div>`}
          <div class="card" style="padding:16px">
            <div class="muted" style="line-height:1.65">Questions about anything here? Reply in the
              thread where you got this link — the team gets notified.</div>
          </div>
        </div>
      </div>
      <div class="foot">Made with demo-narrator</div>
    </div>`;
  const video = document.getElementById("vid");
  wireChapters(video, meta.chapters || []);
  trackViews(video);
}

/* Chapters double as a scrub bar: click to jump, and the one playing stays lit. */
function wireChapters(video, chapters) {
  const buttons = [...document.querySelectorAll("[data-seek]")];
  if (!video || !buttons.length) return;
  buttons.forEach((b) => {
    b.onclick = () => {
      video.currentTime = Number(b.dataset.seek);
      video.play().catch(() => {});
    };
  });
  video.addEventListener("timeupdate", () => {
    const t = video.currentTime;
    let active = -1;
    chapters.forEach((c, i) => {
      if (t >= c.start_sec && (c.end_sec == null || t < c.end_sec)) active = i;
    });
    buttons.forEach((b, i) => b.classList.toggle("on", i === active));
  });
}

/* A view is a watch, not a page load: it is recorded on first play, and the
   watched duration is reported again when the viewer leaves. */
function trackViews(video) {
  if (!video) return;
  let counted = false;
  const send = (seconds, useBeacon, updateLast) => {
    const body = JSON.stringify({ seconds_watched: seconds, update_last: !!updateLast });
    const url = `/s/${encodeURIComponent(token)}/view`;
    if (useBeacon && navigator.sendBeacon) {
      navigator.sendBeacon(url, new Blob([body], { type: "application/json" }));
    } else {
      fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body }).catch(() => {});
    }
  };
  video.addEventListener("play", () => {
    if (counted) return;
    counted = true;
    send(0, false, false);
  }, { once: true });
  window.addEventListener("pagehide", () => {
    if (counted && video.currentTime > 1) send(video.currentTime, true, true);
  });
}

load();
</script>
</body>
</html>
